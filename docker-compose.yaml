version: '3.9'

services:
  timestat_api:
    image: client:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DB_URL: ${DB_URL}
        PG_USER: ${PG_USER}
        PG_PASSWORD: ${PG_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - timestat_db
    environment:
      DB_URL: jdbc:postgresql://timestat_db:5432/timestat
      PG_USER: postgres
      PG_PASSWORD: postgres
  timestat_db:
    image: postgres:14.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data: { }